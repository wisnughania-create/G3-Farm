<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peternakan Bebek Petelur</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#23261f;--mut:#6b705f;--bd:#e3dfd2;--pri:#2f7d5b;--pri2:#e9f4ee;--in:#2f7d5b;--out:#c0452f;--eg:#d99a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a15;--card:#222620;--tx:#eceee6;--mut:#a3a995;--bd:#343a2f;--pri:#58b98c;--pri2:#23352c;--in:#58b98c;--out:#ef7f68;--eg:#f0b94a}}
:root[data-theme="dark"]{--bg:#171a15;--card:#222620;--tx:#eceee6;--mut:#a3a995;--bd:#343a2f;--pri:#58b98c;--pri2:#23352c;--in:#58b98c;--out:#ef7f68;--eg:#f0b94a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;max-width:720px;margin:auto}
header h1{font-size:18px;margin:0}header small{color:var(--mut)}
main{max-width:720px;margin:auto;padding:8px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--pri2);color:var(--pri)}button.del{background:none;color:var(--out);padding:4px 8px}
button:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mut);display:block}
.in{color:var(--in);font-weight:600}.out{color:var(--out);font-weight:600}
.prod{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prod button{background:var(--pri2);color:var(--tx);text-align:left;font-weight:500}.prod button b{display:block;color:var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 2px;font-size:11px;font-weight:500}
nav button.on{color:var(--pri);font-weight:700}nav span{display:block;font-size:20px}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 11px}
svg text{fill:var(--mut);font-size:9px}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.msg{padding:30px 16px;text-align:center;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:14px}
</style>
</head>
<body>
<header><div><h1>🦆 Peternakan Bebek Petelur</h1><small id="who">Memuat…</small></div></header>
<main id="view"><div class="msg">Memuat data…</div></main>
<nav id="nav"></nav>
<script>
var S={tx:[],flock:[],prod:[],products:[]},db=null,me="Pengguna",tab="home",cart={},pendingDel=null,dirty=false,ready=false;
var TABS=[["home","📊","Ringkasan"],["pos","🧾","Kasir"],["fin","💰","Keuangan"],["duck","🦆","Bebek"],["egg","🥚","Produksi"]];
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rp(n){return "Rp"+Math.round(n||0).toLocaleString("id-ID")}
function iso(d){return d.toLocaleDateString("sv")}
function today(){return iso(new Date())}
function dstr(s){var p=s.split("-");return p[2]+"/"+p[1]}
function lastDays(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push(iso(d))}return a}
function duckAt(date){return S.flock.reduce(function(a,f){return f.date<=date?a+(f.type==="masuk"?f.qty:-f.qty):a},0)}
function sum(arr,f){return arr.reduce(function(a,x){return a+(f(x)||0)},0)}

function chart(labels,series){
  var W=340,H=150,L=34,B=18,T=8,R=6,max=1;
  series.forEach(function(s){s.vals.forEach(function(v){if(v>max)max=v})});
  var pw=W-L-R,ph=H-B-T,n=labels.length,out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  for(var g=0;g<=3;g++){var y=T+ph-ph*g/3,val=max*g/3;
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)"/><text x="2" y="'+(y+3)+'">'+(val>=1e6?(val/1e6).toFixed(1)+"jt":val>=1e3?Math.round(val/1e3)+"rb":Math.round(val))+'</text>'}
  labels.forEach(function(l,i){if(i%Math.ceil(n/6)===0){var x=L+pw*i/Math.max(n-1,1);out+='<text x="'+(x-8)+'" y="'+(H-4)+'">'+dstr(l)+'</text>'}});
  series.forEach(function(s){
    var pts=s.vals.map(function(v,i){return (L+pw*i/Math.max(n-1,1)).toFixed(1)+","+(T+ph-ph*v/max).toFixed(1)}).join(" ");
    out+='<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    s.vals.forEach(function(v,i){out+='<circle cx="'+(L+pw*i/Math.max(n-1,1)).toFixed(1)+'" cy="'+(T+ph-ph*v/max).toFixed(1)+'" r="2" fill="'+s.color+'"/>'})});
  return out+"</svg>"+'<div class="leg">'+series.map(function(s){return '<span><i style="background:'+s.color+'"></i>'+s.name+'</span>'}).join("")+"</div>"
}

function vHome(){
  var t=today(),ducks=duckAt(t),pr=S.prod.filter(function(p){return p.date===t}),eggs=sum(pr,function(p){return p.eggs}),
  hdp=ducks?(eggs/ducks*100):0,ym=t.slice(0,7),mt=S.tx.filter(function(x){return x.date.slice(0,7)===ym}),
  inc=sum(mt.filter(function(x){return x.type==="in"}),function(x){return x.amount}),exp=sum(mt.filter(function(x){return x.type==="out"}),function(x){return x.amount}),
  days=lastDays(14),eg=days.map(function(d){return sum(S.prod.filter(function(p){return p.date===d}),function(p){return p.eggs})}),
  ci=days.map(function(d){return sum(S.tx.filter(function(x){return x.date===d&&x.type==="in"}),function(x){return x.amount})}),
  co=days.map(function(d){return sum(S.tx.filter(function(x){return x.date===d&&x.type==="out"}),function(x){return x.amount})});
  return '<div class="grid"><div class="card stat"><b>'+ducks+'</b><span>Jumlah bebek</span></div><div class="card stat"><b>'+eggs+'</b><span>Telur hari ini</span></div>'+
  '<div class="card stat"><b>'+hdp.toFixed(1)+'%</b><span>Produksi harian (HDP)</span></div><div class="card stat"><b class="'+(inc-exp>=0?"in":"out")+'">'+rp(inc-exp)+'</b><span>Laba bulan ini</span></div></div>'+
  '<div class="card"><h2>Kurva produksi telur (14 hari)</h2>'+chart(days,[{name:"Telur",color:"var(--eg)",vals:eg}])+'</div>'+
  '<div class="card"><h2>Kurva pemasukan vs pengeluaran (14 hari)</h2>'+chart(days,[{name:"Pemasukan",color:"var(--in)",vals:ci},{name:"Pengeluaran",color:"var(--out)",vals:co}])+'</div>'
}

function vPos(){
  var h='<div class="card"><h2>Pilih produk</h2>';
  if(!S.products.length)h+='<div class="empty">Belum ada produk.<br><br><button id="seed">Buat produk contoh</button></div>';
  else h+='<div class="prod">'+S.products.map(function(p){return '<button data-add="'+p.id+'">'+esc(p.name)+'<b>'+rp(p.price)+'</b></button>'}).join("")+'</div>';
  h+='<label>Tambah produk baru</label><div style="display:flex;gap:6px"><input id="pn" placeholder="Nama"><input id="pp" type="number" inputmode="numeric" placeholder="Harga"><button id="padd" class="sec">+</button></div></div>';
  var ids=Object.keys(cart).filter(function(k){return cart[k]>0}),total=0;
  h+='<div class="card"><h2>Keranjang</h2>';
  if(!ids.length)h+='<div class="empty">Keranjang kosong</div>';
  ids.forEach(function(id){var p=S.products.find(function(x){return x.id===id});if(!p)return;total+=p.price*cart[id];
    h+='<div class="row"><div>'+esc(p.name)+'<small>'+rp(p.price)+' × '+cart[id]+'</small></div><div class="qty"><button class="sec" data-m="'+id+'">−</button><b>'+cart[id]+'</b><button class="sec" data-a="'+id+'">+</button></div></div>'});
  h+='<div class="row"><b>Total</b><b>'+rp(total)+'</b></div>'+
  '<label>Uang diterima</label><input id="paid" type="number" inputmode="numeric" placeholder="0"><div class="row"><span>Kembalian</span><b id="chg">Rp0</b></div>'+
  '<button id="pay" style="width:100%;margin-top:8px"'+(total?"":" disabled")+'>Bayar &amp; simpan</button></div>';
  var sales=S.tx.filter(function(x){return x.cat==="Penjualan kasir"}).sort(function(a,b){return b.ts-a.ts}).slice(0,8);
  if(sales.length)h+='<div class="card"><h2>Penjualan terakhir</h2>'+sales.map(function(x){return '<div class="row"><div>'+esc(x.note)+'<small>'+dstr(x.date)+' · '+esc(x.by||"")+'</small></div><span class="in">'+rp(x.amount)+'</span></div>'}).join("")+'</div>';
  return h
}

function vFin(){
  var h='<div class="card"><h2>Catat transaksi</h2><select id="ft"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select>'+
  '<label>Kategori</label><select id="fc"><option>Pakan</option><option>Obat &amp; vaksin</option><option>Tenaga kerja</option><option>Listrik &amp; air</option><option>Beli bebek</option><option>Penjualan telur</option><option>Penjualan bebek afkir</option><option>Lainnya</option></select>'+
  '<label>Jumlah (Rp)</label><input id="fa" type="number" inputmode="numeric"><label>Catatan</label><input id="fn"><label>Tanggal</label><input id="fd" type="date" value="'+today()+'">'+
  '<button id="fsave" style="width:100%;margin-top:10px">Simpan</button></div>';
  var list=S.tx.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:b.ts-a.ts}).slice(0,60);
  h+='<div class="card"><h2>Riwayat</h2>'+(list.length?list.map(function(x){return '<div class="row"><div>'+esc(x.cat)+(x.note?' · '+esc(x.note):"")+'<small>'+dstr(x.date)+' · '+esc(x.by||"")+'</small></div><div><span class="'+x.type+'">'+(x.type==="in"?"+":"−")+rp(x.amount)+'</span> <button class="del" data-del="tx/'+x.id+'">'+(pendingDel==="tx/"+x.id?"Yakin?":"Hapus")+'</button></div></div>'}).join(""):'<div class="empty">Belum ada transaksi</div>')+'</div>';
  return h
}

function vDuck(){
  var h='<div class="card stat"><b>'+duckAt(today())+' ekor</b><span>Populasi saat ini</span></div>'+
  '<div class="card"><h2>Catat perubahan populasi</h2><select id="dt"><option value="masuk">Bebek masuk / beli</option><option value="mati">Bebek mati</option><option value="jual">Bebek terjual / afkir</option></select>'+
  '<label>Jumlah (ekor)</label><input id="dq" type="number" inputmode="numeric"><label>Catatan</label><input id="dn"><label>Tanggal</label><input id="dd" type="date" value="'+today()+'">'+
  '<button id="dsave" style="width:100%;margin-top:10px">Simpan</button></div>';
  var L={masuk:"Masuk",mati:"Mati",jual:"Terjual"},list=S.flock.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0}).slice(0,40);
  h+='<div class="card"><h2>Riwayat</h2>'+(list.length?list.map(function(f){return '<div class="row"><div>'+L[f.type]+' '+f.qty+' ekor'+(f.note?' · '+esc(f.note):"")+'<small>'+dstr(f.date)+'</small></div><button class="del" data-del="flock/'+f.id+'">'+(pendingDel==="flock/"+f.id?"Yakin?":"Hapus")+'</button></div>'}).join(""):'<div class="empty">Belum ada data bebek</div>')+'</div>';
  return h
}

function vEgg(){
  var h='<div class="card"><h2>Catat produksi harian</h2><label>Tanggal</label><input id="ed" type="date" value="'+today()+'">'+
  '<label>Telur dihasilkan (butir)</label><input id="ee" type="number" inputmode="numeric"><label>Telur pecah / rusak</label><input id="eb" type="number" inputmode="numeric" value="0"><label>Pakan terpakai (kg)</label><input id="ef" type="number" inputmode="decimal">'+
  '<button id="esave" style="width:100%;margin-top:10px">Simpan</button></div>';
  var list=S.prod.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0}).slice(0,30);
  h+='<div class="card"><h2>Riwayat produksi</h2>'+(list.length?list.map(function(p){var d=duckAt(p.date);return '<div class="row"><div><b>'+p.eggs+'</b> butir'+(p.broken?' <span class="out">('+p.broken+' pecah)</span>':"")+'<small>'+dstr(p.date)+' · HDP '+(d?(p.eggs/d*100).toFixed(1):"–")+'%'+(p.feed?' · pakan '+p.feed+' kg':"")+'</small></div><button class="del" data-del="prod/'+p.id+'">'+(pendingDel==="prod/"+p.id?"Yakin?":"Hapus")+'</button></div>'}).join(""):'<div class="empty">Belum ada data produksi</div>')+'</div>';
  return h
}

function render(){
  $("#nav").innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
  var v={home:vHome,pos:vPos,fin:vFin,duck:vDuck,egg:vEgg}[tab]();
  $("#view").innerHTML=v;dirty=false
}
function softRender(){var a=document.activeElement;if(a&&a.matches&&a.matches("#view input,#view select")){dirty=true;return}render()}

function num(id){return parseFloat($(id).value)||0}
function base(){return {by:me,ts:Date.now()}}
function put(col,data){return db.collection(col).add(Object.assign(base(),data)).catch(function(e){alert("Gagal menyimpan: "+(e&&e.message||e)+"\nPastikan Anda punya izin edit.")})}

document.addEventListener("focusout",function(){setTimeout(function(){if(dirty&&!(document.activeElement&&document.activeElement.matches("#view input,#view select")))render()},150)});
document.addEventListener("input",function(e){if(e.target.id==="paid"){var t=0;Object.keys(cart).forEach(function(k){var p=S.products.find(function(x){return x.id===k});if(p)t+=p.price*cart[k]});$("#chg").textContent=rp(Math.max(0,num("#paid")-t))}});
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!ready)return;var d=b.dataset;
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.add){cart[d.add]=(cart[d.add]||0)+1;render();return}
  if(d.a){cart[d.a]++;render();return}
  if(d.m){cart[d.m]=Math.max(0,cart[d.m]-1);render();return}
  if(d.del){if(pendingDel===d.del){pendingDel=null;db.doc(d.del).delete().catch(function(e){alert("Tidak bisa menghapus (izin?)")})}else{pendingDel=d.del;render()}return}
  switch(b.id){
  case "seed":[["Telur 1 butir",2500],["Telur 1 tray (30)",70000],["Bebek afkir 1 ekor",60000],["Kotoran/pupuk 1 karung",15000]].forEach(function(p){put("products",{name:p[0],price:p[1]})});break;
  case "padd":var n=$("#pn").value.trim(),pr=num("#pp");if(n&&pr>0)put("products",{name:n,price:pr});break;
  case "pay":var tot=0,items=[];Object.keys(cart).forEach(function(k){var p=S.products.find(function(x){return x.id===k});if(p&&cart[k]>0){tot+=p.price*cart[k];items.push(cart[k]+"× "+p.name)}});
    if(tot){put("tx",{type:"in",cat:"Penjualan kasir",amount:tot,note:items.join(", "),date:today()});cart={};render()}break;
  case "fsave":var a=num("#fa");if(a>0)put("tx",{type:$("#ft").value,cat:$("#fc").value,amount:a,note:$("#fn").value.trim(),date:$("#fd").value||today()});break;
  case "dsave":var q=Math.round(num("#dq"));if(q>0)put("flock",{type:$("#dt").value,qty:q,note:$("#dn").value.trim(),date:$("#dd").value||today()});break;
  case "esave":var eg=Math.round(num("#ee"));if(eg>0)put("prod",{date:$("#ed").value||today(),eggs:eg,broken:Math.round(num("#eb")),feed:num("#ef")});break}
});

function sub(col,key,sort){
  db.collection(col).onSnapshot(function(s){S[key]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});softRender()},function(){});
}
(async function(){
  try{
    var user=window.claude&&await claude.use("user");db=window.claude&&await claude.use("db");
    if(!db){$("#view").innerHTML='<div class="msg"><b>Silakan login</b><br>Buka halaman ini lewat tautan yang dibagikan dan masuk dengan akun Claude Anda agar data bisa dimuat.</div>';$("#who").textContent="Belum login";return}
    try{if(user){var p=await user.me();me=(p&&p.name)||"Pengguna"}}catch(e){}
    $("#who").textContent="Masuk sebagai "+me;ready=true;
    sub("tx","tx");sub("flock","flock");sub("prod","prod");sub("products","products");render()
  }catch(e){$("#view").innerHTML='<div class="msg">Gagal memuat: '+esc(e&&e.message||e)+'</div>'}
})();
</script>
</body>
</html>
